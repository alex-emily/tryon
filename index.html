<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>云试衣间</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Serif+SC:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#studio" aria-label="云试衣间">
        <span class="brand-mark">试</span>
        <span>云试衣间</span>
      </a>
    </header>

    <main>
      <div class="hero" id="studio">
        <div class="preview-mosaic" aria-label="试衣预览">
          <div class="preview-toolbar">
            <span class="dot is-red"></span>
            <span class="dot is-yellow"></span>
            <span class="dot is-green"></span>
            <strong>生成预览</strong>
          </div>

          <input id="personInput" class="hidden-input" type="file" accept="image/*" />
          <input id="clothInput" class="hidden-input" type="file" accept="image/*" />

          <label class="tile tile-a upload-tile" for="personInput">
            <span class="step-index" aria-hidden="true">01</span>
            <span class="step-title">人物照片</span>
            <small id="personStepStatus">点击上传</small>
          </label>
          <label class="tile tile-b upload-tile" for="clothInput">
            <span class="step-index" aria-hidden="true">02</span>
            <span class="step-title">衣服照片</span>
            <small id="clothStepStatus">点击上传</small>
          </label>
          <div class="tile tile-c result-tile" id="resultTile">
            <span class="step-index" aria-hidden="true">03</span>
            <span class="step-title" id="resultTileTitle">生成区</span>
            <small id="resultTileStatus">等待上传照片</small>
            <img id="resultImage" class="generated-image" alt="试穿生成图" />
            <canvas id="tryonCanvas" class="generated-preview" width="900" height="1200"></canvas>
            <div class="countdown-overlay" id="countdownOverlay">
              <span class="countdown-label">AI 正在生成</span>
              <span class="countdown-text" id="countdownText"></span>
            </div>
          </div>

          <p class="status-line" id="statusText">等待上传照片</p>

          <div class="preview-actions">
            <button class="download-btn" id="downloadButton" type="button" disabled>
              下载图片
            </button>
          </div>
        </div>
      </div>

      <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightboxClose" type="button" aria-label="关闭预览">&times;</button>
        <img class="lightbox-img" id="lightboxImg" alt="试衣效果图" />
      </div>
    </main>

    <script src="./api-config.js"></script>
    <script src="./upload-module.js"></script>
    <script src="./tryon-generator.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
